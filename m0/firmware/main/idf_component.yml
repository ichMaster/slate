## Component dependencies for Slate M0.
##
## Versions are pinned here for v0.1's own reproducibility and are explicitly
## **not** the project's pins — ARCHITECTURE.md §Stack defers pinning the kept
## tree to v1.1.
##
## The Tab5 BSP at 1.3.0 carries drivers for *both* panel revisions
## (esp_lcd_ili9881c and esp_lcd_st7123) plus both touch controllers, which is
## why the revision can be probed at runtime rather than guessed at build time.

dependencies:
  idf:
    version: ">=5.4"

  espressif/m5stack_tab5:
    version: "^1.3.0"

  ## LVGL is pinned to 9.4.0 **because of the XML module**, and the pin is
  ## load-bearing rather than conservative.
  ##
  ## LVGL shipped `lv_xml` in src/others/xml/ at 9.3.0 and 9.4.0, and **removed
  ## it in 9.5.0** — verified against the upstream trees, not inferred: 9.5.0
  ## contains no lv_xml source anywhere, only ThorVG's unrelated SVG parser.
  ## The BSP pulls esp_lvgl_port ^2, which resolves LVGL to 9.5.0 by default and
  ## would silently leave the platform with no XML renderer at all.
  ##
  ## v0.1 exists to answer whether lv_xml runs on the ESP32-P4, so the pin is
  ## what makes the question askable. See the SLATE-008 ledger for the verdict
  ## and its consequence for the component machinery at v1.3.
  lvgl/lvgl:
    version: "~9.4.0"
